# =============================== Shared (Auth) =============================== #

# AccessControl role grant (replaces the old Rely/Kiss/AddRecorder/AddCommitter wrappers;
# the role field distinguishes wards, readers, recorders and committers).
type RoleGranted @entity {
    id: ID! # transaction hash + event log index
    blockNumber: BigInt!
    blockTimestamp: BigInt!
    transactionHash: Bytes!
    contractAddress: Bytes!
    eventLogIndex: Int!

    # Custom required values
    role: Bytes! # bytes32
    account: Bytes! # address
    sender: Bytes! # address
}

# AccessControl role revocation (replaces the old Deny/Diss/RemoveRecorder/RemoveCommitter wrappers).
type RoleRevoked @entity {
    id: ID! # transaction hash + event log index
    blockNumber: BigInt!
    blockTimestamp: BigInt!
    transactionHash: Bytes!
    contractAddress: Bytes!
    eventLogIndex: Int!

    # Custom required values
    role: Bytes! # bytes32
    account: Bytes! # address
    sender: Bytes! # address
}

# AccessControl role admin change (emitted from constructors wiring role hierarchies).
type RoleAdminChanged @entity {
    id: ID! # transaction hash + event log index
    blockNumber: BigInt!
    blockTimestamp: BigInt!
    transactionHash: Bytes!
    contractAddress: Bytes!
    eventLogIndex: Int!

    # Custom required values
    role: Bytes! # bytes32
    previousAdminRole: Bytes! # bytes32
    newAdminRole: Bytes! # bytes32
}

# One entity for every `File` overload across the system. Unused fields stay null.
type File @entity {
    id: ID! # transaction hash + event log index
    blockNumber: BigInt!
    blockTimestamp: BigInt!
    transactionHash: Bytes!
    contractAddress: Bytes!
    eventLogIndex: Int!

    # Custom values
    ilkId: Bytes
    what: Bytes!
    dataUint: BigInt
    dataAddress: Bytes
}

# One entity for every `Cage` across the system (ledger, spotter, dog: no ilk; adapter: ilk).
type Cage @entity {
    id: ID! # transaction hash + event log index
    blockNumber: BigInt!
    blockTimestamp: BigInt!
    transactionHash: Bytes!
    contractAddress: Bytes!
    eventLogIndex: Int!

    # Custom values
    ilkId: Bytes
}

